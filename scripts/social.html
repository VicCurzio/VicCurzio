<!doctype html>
<!--
  Molde de las imagenes sociales de los repos (assets/social/*.png), las que
  muestra GitHub cuando alguien comparte el enlace de un repositorio.

  Una sola plantilla para todos: el contenido lo inyecta
  scripts/build-social.mjs en window.__CARD. Misma paleta y mismas dos
  tipografias que el portfolio.

  1280x640 es la medida que pide GitHub para la vista previa social.
-->
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --nes-black:#05060c; --nes-navy:#101a3a; --nes-blue:#2b4a8a; --nes-cyan:#3fb8c8;
    --nes-amber:#f7d51d; --nes-white:#e8f4ff; --panel:#0b1226; --edge:#3a4c78;
    --muted:#7f97a6; --text2:#bcd4e2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1280px;height:640px;background:var(--nes-black);position:relative;overflow:hidden;
       font-family:"Press Start 2P",monospace}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(var(--nes-navy) 1px, transparent 1px),
                     linear-gradient(90deg, var(--nes-navy) 1px, transparent 1px);
    background-size:32px 32px;opacity:.4}
  .glow{position:absolute;width:880px;height:880px;right:-300px;bottom:-380px;border-radius:50%;
    background:radial-gradient(circle, rgba(63,184,200,.14) 0%, transparent 62%)}
  .frame{position:absolute;inset:20px;border:4px solid var(--nes-blue)}
  .inner{position:absolute;inset:20px;padding:56px 60px 108px;display:flex;flex-direction:column;justify-content:center}
  .kicker{font-size:12px;letter-spacing:.3em;color:var(--nes-cyan)}
  .dot{display:inline-block;width:8px;height:8px;background:var(--nes-cyan);margin-right:12px;vertical-align:1px}
  h1{font-size:50px;line-height:1.3;color:var(--nes-white);text-shadow:5px 5px 0 var(--nes-blue);
     margin-top:30px;letter-spacing:.01em}
  .lead{font-family:VT323,monospace;font-size:34px;color:var(--text2);margin-top:32px;line-height:1.32;max-width:1000px}
  .hook{font-family:VT323,monospace;font-size:29px;color:var(--nes-amber);margin-top:22px;line-height:1.32;max-width:1000px}
  .chips{position:absolute;left:80px;bottom:62px;display:flex;flex-wrap:wrap;gap:10px}
  .chip{font-family:VT323,monospace;font-size:22px;line-height:1;color:var(--text2);
        border:3px solid var(--edge);background:var(--panel);padding:7px 13px 5px}
  .who{position:absolute;right:80px;bottom:70px;font-size:11px;letter-spacing:.2em;color:var(--muted)}
  .scan{position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.15) 2px 4px)}
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div><div class="frame"></div>
  <div class="inner">
    <div class="kicker"><span class="dot"></span><span id="kicker"></span></div>
    <h1 id="name"></h1>
    <div class="lead" id="lead"></div>
    <div class="hook" id="hook"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="who">GITHUB.COM/VICCURZIO</div>
  <div class="scan"></div>
  <script>
    const c = window.__CARD;
    document.getElementById("kicker").textContent = c.kicker;
    document.getElementById("name").textContent = c.name;
    document.getElementById("lead").textContent = c.lead;
    document.getElementById("hook").textContent = c.hook;
    const host = document.getElementById("chips");
    for (const t of c.chips) {
      const s = document.createElement("span");
      s.className = "chip";
      s.textContent = t;
      host.appendChild(s);
    }
    document.body.dataset.ready = "1";
  </script>
</body></html>
