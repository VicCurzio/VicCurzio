<!doctype html>
<!--
  Fuente de assets/stack.png, el panel de tecnologias del README.

  Reemplaza a las insignias de shields.io: mismas palabras, pero con la paleta
  y las tipografias del portfolio en vez del estilo que tienen todos los
  perfiles. Una imagen propia dice mas que cuarenta logos ajenos.

  Si cambia el stack, se edita aca y se corre `npm run stack`.
-->
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --nes-black:#05060c; --nes-navy:#101a3a; --nes-blue:#2b4a8a; --nes-cyan:#3fb8c8;
    --nes-amber:#f7d51d; --nes-white:#e8f4ff; --panel:#0b1226; --edge:#3a4c78;
    --muted:#7f97a6; --text2:#bcd4e2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1280px;height:470px;background:var(--nes-black);position:relative;overflow:hidden}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(var(--nes-navy) 1px, transparent 1px),
                     linear-gradient(90deg, var(--nes-navy) 1px, transparent 1px);
    background-size:32px 32px;opacity:.4}
  .frame{position:absolute;inset:18px;border:4px solid var(--nes-blue);background:rgba(11,18,38,.5)}
  .inner{position:absolute;inset:18px;padding:34px 44px}
  .title{font-family:"Press Start 2P",monospace;font-size:13px;letter-spacing:.3em;color:var(--nes-cyan);
         border-bottom:3px solid var(--edge);padding-bottom:18px}
  .row{display:flex;align-items:flex-start;margin-top:26px;gap:26px}
  .lab{font-family:"Press Start 2P",monospace;font-size:10px;letter-spacing:.16em;color:var(--muted);
       width:168px;flex:none;padding-top:9px;text-align:right}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{font-family:VT323,monospace;font-size:23px;line-height:1;color:var(--text2);
        border:3px solid var(--edge);background:var(--panel);padding:7px 13px 5px;letter-spacing:.03em}
  .chip.key{border-color:var(--nes-cyan);color:var(--nes-white)}
</style></head>
<body>
  <div class="grid"></div>
  <div class="frame"></div>
  <div class="inner">
    <div class="title">STACK</div>

    <div class="row"><div class="lab">BACK END</div><div class="chips">
      <span class="chip key">TypeScript</span><span class="chip key">Node</span><span class="chip key">NestJS</span>
      <span class="chip">Fastify</span><span class="chip">Express</span><span class="chip">Python</span><span class="chip">Ruby on Rails</span>
    </div></div>

    <div class="row"><div class="lab">FRONT END</div><div class="chips">
      <span class="chip key">React</span><span class="chip key">Next.js</span>
      <span class="chip">Vite</span><span class="chip">Tailwind</span><span class="chip">Material UI</span>
    </div></div>

    <div class="row"><div class="lab">DATA</div><div class="chips">
      <span class="chip key">PostgreSQL</span><span class="chip">MySQL</span><span class="chip">Drizzle</span>
      <span class="chip">Sequelize</span><span class="chip">Redis</span><span class="chip">BullMQ</span>
    </div></div>

    <div class="row"><div class="lab">INFRASTRUCTURE</div><div class="chips">
      <span class="chip key">Docker</span><span class="chip">nginx</span><span class="chip">PM2</span>
      <span class="chip">GitHub Actions</span><span class="chip">Linux</span><span class="chip">Cloudflare</span><span class="chip">Vercel</span>
    </div></div>

    <div class="row"><div class="lab">TESTING</div><div class="chips">
      <span class="chip">Playwright</span><span class="chip">Vitest</span>
    </div></div>
  </div>
</body></html>
